[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/laserdata/laser-example-frostline"
rust-version = "1.98.0"
version = "0.1.0"

[workspace.dependencies]
apache-avro = { version = "0.22.0" }
bytes = { version = "1.12.1" }
ciborium = { version = "0.2.2" }
frostline-consumers = { path = "crates/consumers" }
frostline-demo = { path = "crates/demo" }
frostline-producer = { path = "crates/producer" }
frostline-shared = { path = "crates/shared" }
laser-sdk = { version = "0.7.0", features = ["filters", "schema-codecs"] }
prost = { version = "0.14.4" }
protox = { version = "0.10.0" }
rand = { version = "0.10", features = ["chacha"] }
secrecy = { version = "0.10.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = { version = "0.11.0" }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.21" }
tokio = { version = "1.53.2", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[profile.release]
codegen-units = 1
debug = 1
lto = true
